<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
</head>

<body>
  <h1>BMI Calculator</h1>
  <form action="/" method="POST">
    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" name="weight" placeholder="Weight in kg" min="0.1" step="any" required>
    <label for="height">Height (cm)</label>
    <input type="number" id="height" name="height" placeholder="Height in cm" min="0.1" step="any" required>
    <button type="submit">Calculate BMI</button>
  </form>
</body>

</html>
